[package]
name = "jingdu-reader"
version = "0.3.0"
edition = "2021"
description = "A local Rust desktop reader for large Chinese TXT novels"

[[bin]]
name = "novel-reader"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "0.15", default-features = false }
regex = "=1.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "=1.0.114"
